[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "condepe"
version = "0.1.2"
description = "Dados abertos do Observatório de Pernambuco (Condepe/Fidem) no Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "André Leite", email = "leite@castlab.org" },
    { name = "Marcos Wasiliew", email = "marcos.wasiliew@gmail.com" },
    { name = "Hugo Vasconcelos", email = "hugo.vasconcelos@ufpe.br" },
    { name = "Carlos Amorim", email = "carlos.agaf@ufpe.br" },
    { name = "Diogo Bezerra", email = "diogo.bezerra@ufpe.br" },
    { name = "Júlia Nascimento Barreto", email = "juliabarreto@gd.seplag.pe.gov.br" },
]
keywords = ["Pernambuco", "Condepe/Fidem", "open-data", "statistics", "Brazil", "municipalities", "pandas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.25",
    "pandas>=1.3",
    "pyarrow>=10",
    "platformdirs>=3",
]

[project.urls]
Homepage = "https://strategicprojects.github.io/condepe-py/"
Data = "https://cf.pe.gov.br/observatorio"
Repository = "https://github.com/StrategicProjects/condepe-py"
Issues = "https://github.com/StrategicProjects/condepe-py/issues"
Changelog = "https://github.com/StrategicProjects/condepe-py/blob/main/NEWS.md"

[project.optional-dependencies]
geo = ["geopandas>=1.0"]
test = ["pytest>=7", "responses>=0.23"]
dev = ["pytest>=7", "responses>=0.23", "ruff>=0.6", "build>=1.0"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "matplotlib>=3.5", "geopandas>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/condepe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real Observatory endpoints (run with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Ruff's defaults, pinned so a global user config cannot change the result
# locally versus CI.
select = ["E4", "E7", "E9", "F"]
