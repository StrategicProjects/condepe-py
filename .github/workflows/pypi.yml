# Publishes condepe to PyPI via trusted publishing (OIDC, no token).
# Runs on tags v* (e.g. v0.1.0) or manually. Register once on pypi.org
# (Publishing -> pending publisher): owner StrategicProjects, repository
# condepe-py, workflow pypi.yml, environment pypi. Do not rename this file.
name: pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "v$declared" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject $declared"; exit 1; }
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: pip install dist/*.whl && python -I -c "import condepe; print(condepe.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # A Docker action: pin the release tag, not a commit SHA.
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          skip-existing: true
