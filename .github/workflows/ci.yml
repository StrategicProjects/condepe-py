name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, after the Saturday publication cycle of the Observatory.
    - cron: "0 12 * * 0"
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS left out: the code is OS-independent and GitHub's macOS arm64
        # runners were unavailable (jobs cancelled after 15 min in the queue).
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,geo]"
      - run: ruff check .
      - run: pytest -q

  # The ADR 0006 acceptance check: from a runner outside Brazil, the package
  # must return Recife's population (canonical endpoint or the mirror).
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,geo]"
      - run: pytest -q -m live
