site_name: condepe
site_description: Dados abertos do Observatório de Pernambuco (Condepe/Fidem) no Python
site_url: https://strategicprojects.github.io/condepe-py/
repo_url: https://github.com/StrategicProjects/condepe-py
repo_name: StrategicProjects/condepe-py
copyright: Código MIT · Dados das fontes originais, organizados pela Condepe/Fidem (CC BY 4.0)

theme:
  name: material
  language: pt-BR
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.sections
    - content.code.copy
    - search.highlight

extra_css:
  - assets/extra.css

nav:
  - Início: index.md
  - Primeiros passos: primeiros-passos.md
  - Exemplos: exemplos.md
  - Mapas: mapas.md
  - Fontes do Observatório: fontes.md
  - Referência das funções: api.md
  - Novidades: news.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: false
            members_order: source

exclude_docs: |
  precompile.py
